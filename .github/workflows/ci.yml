name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# CI 仅需读取代码，显式声明最小权限
permissions:
  contents: read

jobs:
  test:
    name: Test and Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Code Lint and Vet
        run: go vet ./...

      - name: Run Unit Tests with Race Detector
        run: go test -v -race ./...

      - name: Verify Cross Compilation
        run: |
          echo "==> Verifying Linux ARM64 compilation..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o /dev/null ./cmd/router_metrics

          echo "==> Verifying Linux ARMv7 compilation..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=7 go build -o /dev/null ./cmd/router_metrics

          echo "==> Verifying Linux ARMv5 compilation..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm GOARM=5 go build -o /dev/null ./cmd/router_metrics

          echo "==> Verifying Linux AMD64 compilation..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /dev/null ./cmd/router_metrics

          echo "==> Verifying Linux MIPSel (softfloat) compilation..."
          CGO_ENABLED=0 GOOS=linux GOARCH=mipsle GOMIPS=softfloat go build -o /dev/null ./cmd/router_metrics

          echo "==> Verifying Linux MIPS big-endian (softfloat) compilation..."
          CGO_ENABLED=0 GOOS=linux GOARCH=mips GOMIPS=softfloat go build -o /dev/null ./cmd/router_metrics
