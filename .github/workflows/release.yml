name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (例如 v1.0.0，手动触发时可选填)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: 'go.mod'
          check-latest: true
          cache: true

      - name: Install UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl

      - name: Resolve Version Information
        id: vars
        env:
          # 通过环境变量传入用户输入，避免直接内插到脚本造成 Shell 注入
          TAG_INPUT: ${{ github.event.inputs.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "${TAG_INPUT}" ]; then
            # 白名单校验手动输入的 tag，防止恶意字符
            if ! echo "${TAG_INPUT}" | grep -qE '^v[0-9A-Za-z._-]+$'; then
              echo "错误: tag_name 格式非法，必须匹配 ^v[0-9A-Za-z._-]+$" >&2
              exit 1
            fi
            VERSION="${TAG_INPUT}"
          elif [ "${REF_TYPE}" = "tag" ]; then
            VERSION="${REF_NAME}"
          else
            VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          fi
          
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT}" >> $GITHUB_OUTPUT
          echo "build_time=${BUILD_TIME}" >> $GITHUB_OUTPUT
          echo "Target Release Version: ${VERSION} (${COMMIT}) built at ${BUILD_TIME}"

      - name: Cross Compile and Package Binaries
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          COMMIT: ${{ steps.vars.outputs.commit }}
          BUILD_TIME: ${{ steps.vars.outputs.build_time }}
        run: |
          mkdir -p dist staging

          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.BuildTime=${BUILD_TIME}"

          # 目标架构矩阵: GOOS:GOARCH:EXTRA_ENV:TARGET_SUFFIX
          # 包名后缀采用 uname -m 风格架构标记，便于用户在设备上对照确认
          # 覆盖博通 64位(aarch64)、博通 32位(armv7)、老款 ARM(armv5)、
          # 联发科小路由(mipsel)、Atheros 系 OpenWrt(mips 大端)、以及 x86/macOS 平台
          TARGETS=(
            "linux:arm64::linux-aarch64"
            "linux:arm:7:linux-armv7"
            "linux:arm:5:linux-armv5"
            "linux:mipsle:softfloat:linux-mipsel"
            "linux:mips:softfloat:linux-mips"
            "linux:amd64::linux-x86_64"
            "darwin:arm64::darwin-arm64"
            "darwin:amd64::darwin-amd64"
          )

          for target in "${TARGETS[@]}"; do
            IFS=":" read -r GOOS GOARCH GOEXTRA TARGET_SUFFIX <<< "$target"
            PACKAGE_NAME="router_metrics-${VERSION}-${TARGET_SUFFIX}"
            TARGET_DIR="staging/${PACKAGE_NAME}"
            mkdir -p "${TARGET_DIR}"

            echo "=========================================================="
            echo "==> Building ${GOOS}/${GOARCH} (${TARGET_SUFFIX})..."

            export CGO_ENABLED=0
            export GOOS=${GOOS}
            export GOARCH=${GOARCH}

            if [ "${GOARCH}" = "arm" ] && [ -n "${GOEXTRA}" ]; then
              export GOARM=${GOEXTRA}
            else
              unset GOARM
            fi

            if { [ "${GOARCH}" = "mipsle" ] || [ "${GOARCH}" = "mips" ]; } && [ -n "${GOEXTRA}" ]; then
              export GOMIPS=${GOEXTRA}
            else
              unset GOMIPS
            fi

            BINARY_PATH="${TARGET_DIR}/router_metrics"
            go build -ldflags="${LDFLAGS}" -o "${BINARY_PATH}" ./cmd/router_metrics

            # 对 Linux 二进制进行 UPX 极限压缩，减小路由器 JFFS/U盘 空间占用
            # MIPS 系跳过压缩，避免 UPX 对软浮点 MIPS 产生兼容性问题
            if [ "${GOOS}" = "linux" ] && [ "${GOARCH}" != "mipsle" ] && [ "${GOARCH}" != "mips" ]; then
              echo "==> Compressing with UPX..."
              upx --best --lzma "${BINARY_PATH}" || echo "Warning: UPX compression skipped or failed for ${TARGET_SUFFIX}"
            fi

            # 打包附带配置文件示例与说明文档
            if [ -f "scripts/services-start.sample" ]; then
              cp scripts/services-start.sample "${TARGET_DIR}/"
            fi
            if [ -f "README.md" ]; then
              cp README.md "${TARGET_DIR}/"
            fi

            TAR_PATH="dist/${PACKAGE_NAME}.tar.gz"
            tar -czf "${TAR_PATH}" -C staging "${PACKAGE_NAME}"
            echo "==> Archive created: ${TAR_PATH} ($(ls -lh "${TAR_PATH}" | awk '{print $5}'))"
          done

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum router_metrics-*.tar.gz > checksums.txt
          echo "==> SHA256 Checksums:"
          cat checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          # 使用 GitHub 官方 gh CLI 发布 Release，避免依赖第三方 Action
          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "==> Release ${VERSION} 已存在，上传产物..."
            gh release upload "${VERSION}" dist/router_metrics-*.tar.gz dist/checksums.txt \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            # tag 含 "-"（如 v1.0.0-rc.1、v0.9.0-beta.1）视为预发布版本
            PRERELEASE_FLAG=""
            if echo "${VERSION}" | grep -q -- "-"; then
              echo "==> 检测到预发布版本号，标记为 Pre-release"
              PRERELEASE_FLAG="--prerelease"
            fi
            echo "==> 创建 Release ${VERSION}..."
            gh release create "${VERSION}" dist/router_metrics-*.tar.gz dist/checksums.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${VERSION}" \
              --generate-notes ${PRERELEASE_FLAG}
          fi
